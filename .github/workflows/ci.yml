name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository. It uses no secrets and
# is not triggered by pull_request_target, so code from a fork never runs with
# write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit hashes, so a moved tag cannot change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: No symlinks in the repo (plugins may not contain any)
        run: |
          if find . -path ./.git -prune -o -type l -print | grep -q .; then
            echo "symlinks are not allowed in plugins"; exit 1
          fi

      - name: Row, move and key logic
        run: node tests/layout.test.js

      - name: Layout script (save, restore, default)
        run: bash tests/layout-script.test.sh

      - name: Update script
        run: bash tests/update-script.test.sh

      - name: Mutation check (the tests must notice deliberate breakage)
        run: node tests/mutation.test.js

      - name: Shell lint
        run: shellcheck scripts/*.sh tests/*.sh assets/src/*.sh

      - name: Formatting
        run: npx --yes prettier@3.3.3 --check .

      - name: Marketplace manifest rules and security baseline (the marketplace's own code, pinned)
        run: bash tests/marketplace.sh
