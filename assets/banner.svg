<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Omadeck: a deck for your Omarchy bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="1" stop-color="#2a1d4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- the bar: three lanes of widgets -->
  <rect x="60" y="48" width="1080" height="44" rx="10" fill="#ffffff" fill-opacity="0.06"/>
  <g fill="#c0caf5" fill-opacity="0.55">
    <rect x="80" y="62" width="16" height="16" rx="4"/>
    <rect x="108" y="62" width="16" height="16" rx="4"/>
    <rect x="136" y="62" width="16" height="16" rx="4"/>
    <rect x="520" y="62" width="160" height="16" rx="4"/>
    <rect x="1000" y="62" width="16" height="16" rx="4"/>
    <rect x="1056" y="62" width="16" height="16" rx="4"/>
    <rect x="1084" y="62" width="16" height="16" rx="4"/>
  </g>
  <rect x="1028" y="60" width="20" height="20" rx="5" fill="url(#accent)"/>

  <!-- the deck -->
  <g transform="translate(60 128)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#7aa2f7" stroke-opacity="0.35"/>
    <text x="20" y="34" fill="#7aa2f7" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">LEFT</text>
    <rect x="20" y="52" width="260" height="22" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="20" y="82" width="260" height="22" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  </g>
  <g transform="translate(380 128)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#bb9af7" stroke-opacity="0.35"/>
    <text x="20" y="34" fill="#bb9af7" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2">CENTER</text>
    <rect x="20" y="52" width="260" height="22" rx="6" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="20" y="82" width="260" height="22" rx="6" fill="url(#accent)" fill-opacity="0.35"/>
    <rect x="20" y="112" width="260" height="22" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <text x="720" y="200" fill="#c0caf5" font-family="monospace" font-size="72" font-weight="700">Omadeck</text>
  <text x="724" y="244" fill="#c0caf5" fill-opacity="0.75" font-family="monospace" font-size="22">A deck for your Omarchy bar.</text>
</svg>
