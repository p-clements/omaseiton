<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="512" viewBox="0 0 1920 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <image href="banner-bg.png" width="1920" height="512"/>

  <!-- kanji: 整頓 (seiton), a soft glow underneath and the crisp glyphs on top -->
  <text x="112" y="236" font-family="Noto Serif CJK JP" font-weight="700" font-size="190" fill="#7aa2f7" opacity="0.55" filter="url(#glow)">整頓</text>
  <text x="112" y="236" font-family="Noto Serif CJK JP" font-weight="700" font-size="190" fill="#c8b6ff">整頓</text>

  <!-- wordmark -->
  <text x="108" y="376" font-family="JetBrainsMono Nerd Font" font-weight="700" font-size="124" letter-spacing="-3" fill="#eceeff">Omaseiton</text>

  <!-- tagline, with one small vermilion square as the accent -->
  <rect x="112" y="414" width="22" height="22" rx="5" fill="#ff7a4d"/>
  <text x="150" y="434" font-family="Geist" font-size="36" fill="#a9b4e6">Everything in its place on your Omarchy bar.</text>
</svg>
